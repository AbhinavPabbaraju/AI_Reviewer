[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.1.0"
description = "An AI pull-request reviewer optimized for precision, not coverage."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abhinav Pabbaraju" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pathspec>=0.12",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "pydantic-settings>=2.0",
    "uvicorn[standard]>=0.30",
    # The Ollama adapter is a first-class runtime path (free, local review), so
    # its HTTP client is a runtime dependency rather than a test-only one.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-asyncio>=0.23",
    "mypy>=1.9",
    "ruff>=0.4",
    # asgi-lifespan runs the app's startup/shutdown in tests so it opens its
    # own pool exactly as it does in production. (httpx is a runtime dependency,
    # declared above, and also transports the API tests.)
    "asgi-lifespan>=2.1",
]

# `app` (domain/infra/api) and `worker` (pipeline/tasks) are two top-level
# packages living under separate service roots, installed as one distribution.
# ADR-005: the worker shares `app.domain` as an installed local package.
[tool.setuptools.packages.find]
where = ["services/api", "services/worker"]
include = ["app*", "worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/api", "services/worker"]
addopts = "-ra --strict-markers -m 'not slow'"
asyncio_mode = "auto"
markers = [
    # The M1 latency gate builds a real 5,000-file git repository and indexes it
    # twice. It is an exit criterion and must run in CI (`pytest -m slow`), but
    # it is minutes long, so the default suite stays fast enough to run on save.
    "slow: measured performance gates; deselected by default",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services/api", "services/worker", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
# The domain is the contract spine and is held to strict typing (M0/M1 exit
# criteria). Infra adapters wrap untyped third-party libraries (tree-sitter),
# so a couple of pragmatic escape hatches are configured per-module below.
mypy_path = "services/api:services/worker"
packages = ["app", "worker"]

[[tool.mypy.overrides]]
module = ["tree_sitter_python.*", "tree_sitter_typescript.*"]
ignore_missing_imports = true

# asyncpg ships no py.typed. The Postgres adapters therefore hold their
# connections as `Any` and convert every row into a validated domain model at
# the boundary -- the pydantic constructors in `_to_symbol`/`_to_chunk` are
# where the types actually come back, and they run at runtime rather than only
# under mypy.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
